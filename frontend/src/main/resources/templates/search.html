<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Search</title>
</head>
<body style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; margin:2rem;">
        <h1>Search Results</h1>
        <form th:action="@{/search}" method="get" style="margin-bottom:2rem;">
            <input type="text" name="q" th:value="${query}" placeholder="Search terms" />
            <button type="submit">Search</button>
        </form>
        <div th:if="${results}">
            <ul>
                <li th:each="result : ${results}">
                    <span th:text="${result.url}"></span> - <span th:text="${result.title}"></span>
                </li>
            </ul>
            <div>
                <a th:if="${page > 1}"
                   th:href="@{'/search'(q=${query}, page=${page - 1})}">
                    Previous
                </a>
                <span style="margin: 0 10px;">Page <span th:text="${page}">1</span></span>
                <a th:href="@{'/search'(q=${query}, page=${page + 1})}">
                    Next
                </a>
            </div>
        </div>
        <a href="/" style="display:inline-block; margin-top:2rem; padding:0.5rem 1rem; background:#eee; border-radius:4px; text-decoration:none; color:#333;">Back to Index</a>
</body>
</html>
